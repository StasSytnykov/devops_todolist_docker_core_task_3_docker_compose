version: '3'
networks:
  db-data-net:
    driver: bridge
services:
  todoapp:
    image: todoapp:1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - db-data-net
    depends_on:
      - mytodosql
    restart: unless-stopped
  mytodosql:
    image: mytodosql:1.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mytodosql
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - db-data-net
volumes:
  db-data:
